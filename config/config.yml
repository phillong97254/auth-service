rest_server:
  name: auth-service
  addr: ":9000"
  shutdown_timeout: 5

api:
  version: v1.0.0
  env: debug

oauth:
  # issuer chỉ là chuỗi so khớp claim "iss", các service khác phải cấu hình giống hệt.
  issuer: http://localhost:9000
  audience: admin-api
  key_id: demo-key-1
  token_ttl: 900 # giây
