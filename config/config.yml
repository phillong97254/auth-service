rest_server:
  name: auth-service
  addr: ":9000"
  shutdown_timeout: 5

api:
  version: v1.0.0
  env: debug

oauth:
  # issuer chỉ là chuỗi so khớp claim "iss", các service khác phải cấu hình giống hệt.
  issuer: http://localhost:9000
  audience: admin-api
  key_id: demo-key-1
  token_ttl: 900 # giây
  # Secret của OAuth client "backoffice" (client_credentials). KHÔNG ghi ở đây,
  # đặt qua env OAUTH_BACKOFFICE_CLIENT_SECRET (file .env, không commit).
  backoffice_client_secret: ""

authz_service:
  addr: localhost:50052
  timeout: 3 # giây

db:
  url: "" # KHÔNG ghi ở đây, đặt qua env DB_URL (file .env, không commit)
  max_open_connections: 20
  max_idle_connections: 10
  connection_max_lifetime: 5 # phút
  connection_max_idle_time: 5 # phút
  auto_migrate: true
  log_sql: false
