name: "go-admin-wallet-auth-service"
# Chạy riêng service này trong Docker (make up). Các service khác chạy trên máy (go run)
# hoặc container khác, gọi qua host.docker.internal. Chạy cả hệ thống: docker-compose.yml ở thư mục gốc.
services:
  auth-service:
    container_name: auth-service-${ENV:-dev}
    image: ${REGISTRY:-ghcr.io/phillong97254}/auth-service:${TAG:-dev-latest}
    build:
      context: .
    ports:
      - "9000:9000"
    environment:
      REST_SERVER_ADDR: ":9000"
      AUTHZ_SERVICE_ADDR: host.docker.internal:50052
      OAUTH_BACKOFFICE_CLIENT_SECRET: ${OAUTH_BACKOFFICE_CLIENT_SECRET:?đặt trong .env (xem .env.example)}
      DB_URL: postgres://auth:${DB_PASSWORD:?đặt trong .env (xem .env.example)}@postgres:5432/auth_db?sslmode=disable
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - auth-service-network

  # Postgres riêng của service (database-per-service). Dữ liệu ở ./tmp/postgres_data (không commit).
  postgres:
    container_name: auth-service-postgres-${ENV:-dev}
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${DB_PASSWORD:?đặt trong .env (xem .env.example)}
      POSTGRES_DB: auth_db
      TZ: UTC
    volumes:
      - ./tmp/postgres_data:/var/lib/postgresql/data
    ports:
      - "54321:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth_db"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    networks:
      - auth-service-network

networks:
  auth-service-network:
    driver: bridge
